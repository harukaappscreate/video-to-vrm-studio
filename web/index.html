<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Video → VRM Studio (Zero-ML Polar-Loft Hybrid)</title>
<style>
  :root {
    --bg: #0c101b; --panel: #121827; --card: #182034; --border: #26314d;
    --text: #e6ecf7; --muted: #93a1be; --accent: #5b8cff; --accent2: #22d3ee;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
    font-size: 13px; overflow: hidden;
  }
  .app { display: grid; grid-template-columns: 374px 1fr; height: 100vh; width: 100vw; }
  .sidebar { background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; padding: 14px; gap: 11px; }
  .header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .title-wrap h1 { margin: 0; font-size: 15px; font-weight: 700; }
  .badge { display: inline-block; margin-top: 4px; padding: 2px 7px; border-radius: 999px; background: rgba(34, 211, 238, 0.14); color: var(--accent2); font-size: 10px; font-weight: 600; border: 1px solid rgba(34, 211, 238, 0.35); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 11px; display: flex; flex-direction: column; gap: 8px; }
  .card-title { font-size: 12px; font-weight: 700; color: #c9d6f0; text-transform: uppercase; letter-spacing: 0.4px; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  input[type="text"] { background: #1e2942; color: var(--text); border: 1px solid var(--border); border-radius: 7px; padding: 7px 8px; font-size: 12px; box-sizing: border-box; margin-bottom: 8px; }
  button, select { background: #1e2942; color: var(--text); border: 1px solid var(--border); border-radius: 7px; padding: 7px 8px; font-size: 12px; cursor: pointer; transition: background 0.15s, border-color 0.15s; }
  button:hover:not(:disabled) { background: #273556; border-color: #3d5284; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.primary { background: linear-gradient(135deg, #4b7cf5, #2563eb); border-color: #60a5fa; font-weight: 600; }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); }
  button.active { background: #26407a; border-color: var(--accent); color: #fff; }
  label.small { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; width: 100%; }
  input[type="range"] { width: 100%; accent-color: var(--accent); margin: 2px 0; }
  .dropzone { border: 1px dashed #3b4b75; border-radius: 8px; padding: 9px; text-align: center; color: var(--muted); font-size: 11px; cursor: pointer; background: rgba(12, 16, 27, 0.45); }
  .dropzone.drag { border-color: var(--accent2); color: var(--accent2); background: rgba(34, 211, 238, 0.08); }
  .prog-bar { width: 100%; height: 7px; background: #0c101b; border-radius: 999px; overflow: hidden; border: 1px solid var(--border); }
  .prog-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 0.15s; }
  .status-txt { font-size: 11px; color: var(--muted); min-height: 15px; }
  .uv-box { width: 100%; aspect-ratio: 1; background: #0b0e17; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .uv-box canvas { width: 100%; height: 100%; object-fit: contain; }
  .expr-list { display: flex; flex-direction: column; gap: 5px; max-height: 175px; overflow-y: auto; padding-right: 4px; }
  .expr-item { display: grid; grid-template-columns: 78px 1fr 34px; align-items: center; gap: 6px; font-size: 11px; }
  .viewport { position: relative; width: 100%; height: 100%; background: radial-gradient(circle at 50% 35%, #192238 0%, #0b0f1b 75%); }
  #glCanvas { width: 100%; height: 100%; display: block; cursor: grab; }
  #glCanvas:active { cursor: grabbing; }
  .hud { position: absolute; top: 12px; left: 12px; right: 12px; pointer-events: none; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .hud-pill { pointer-events: auto; background: rgba(12, 16, 27, 0.78); backdrop-filter: blur(8px); border: 1px solid var(--border); border-radius: 9px; padding: 7px 11px; font-size: 11px; color: #cbd5e1; }
  .cam-bar { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; background: rgba(12, 16, 27, 0.84); backdrop-filter: blur(8px); padding: 6px 8px; border-radius: 10px; border: 1px solid var(--border); }
  .mesh-chips { display: flex; gap: 5px; flex-wrap: wrap; }
  .chip { padding: 3px 8px; border-radius: 999px; font-size: 11px; cursor: pointer; border: 1px solid var(--border); background: #121a2d; color: var(--muted); }
  .chip.on { background: rgba(91, 140, 255, 0.22); border-color: var(--accent); color: #eaf1ff; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="header">
      <div class="title-wrap">
        <h1 data-i18n="appTitle">Video → VRM Studio</h1>
        <span class="badge" data-i18n="appBadge">骨格ロック・極座標ロフト / Zero-ML</span>
      </div>
      <button id="langBtn" title="Switch Language">EN</button>
    </div>

    <div class="card">
      <div class="card-title" data-i18n="secInput">1. 入力動画 & キャリブレーション</div>
      <div class="grid2">
        <button id="btnSampleUniform" data-i18n="sampleUniform">制服サンプル</button>
        <button id="btnSampleIdol" data-i18n="sampleIdol">アイドル</button>
      </div>
      <div id="dropZone" class="dropzone" data-i18n="dropHint">ここに 10秒ターンテーブル MP4 をドロップ / クリックして選択</div>
      <input id="fileInput" type="file" accept="video/mp4,video/*" hidden />
      <div class="grid2">
        <div>
          <label class="small"><span data-i18n="poseModeLbl">ポーズ判定</span></label>
          <select id="poseModeSel" style="width:100%;">
            <option value="auto" data-i18n="optAuto">自動 (T / A-pose)</option>
            <option value="tpose">T-pose</option>
            <option value="apose">A-pose</option>
          </select>
        </div>
        <div>
          <label class="small"><span data-i18n="keyThLbl">クロマキー閾値</span><span id="keyThVal">24</span></label>
          <input id="keyThRange" type="range" min="10" max="48" value="24" />
        </div>
      </div>
      <button id="btnBuild" class="primary" disabled data-i18n="btnBuild">VRMモデルを生成</button>
      <div class="prog-bar"><div id="progFill" class="prog-fill"></div></div>
      <div id="statusTxt" class="status-txt" data-i18n="statusIdle">動画を選択して生成を開始してください</div>
    </div>

    <div class="card">
      <div class="card-title" data-i18n="secPose">2. ポーズ / モーション</div>
      <div class="grid2">
        <button class="pose-btn active" data-pose="tpose">T-Pose</button>
        <button class="pose-btn" data-pose="idle" data-i18n="poseIdle">Idle (自然立ち)</button>
        <button class="pose-btn" data-pose="wave" data-i18n="poseWave">手振り (Wave)</button>
        <button class="pose-btn" data-pose="vrma" data-i18n="poseDemoVrma">デモ動作</button>
      </div>
      <div class="row">
        <button id="btnPlayPause" style="width:100%;" data-i18n="pauseBtn">アニメーション一時停止</button>
      </div>
      <label class="small"><span data-i18n="meshVisLbl">メッシュ表示 (4パーツ)</span></label>
      <div class="mesh-chips" id="meshChips">
        <span class="chip on" data-mesh="body">Body</span>
        <span class="chip on" data-mesh="head">Head</span>
        <span class="chip on" data-mesh="torso">Torso</span>
        <span class="chip on" data-mesh="hair">Hair</span>
      </div>
    </div>

    <div class="card">
      <div class="card-title" data-i18n="secExpr">3. 表情モーフ (13種)</div>
      <div id="exprList" class="expr-list"></div>
    </div>

    <div class="card">
      <div class="card-title" data-i18n="secExport">4. VRMエクスポート & UVアトラス</div>
      <div class="grid2">
        <select id="shaderSel">
          <option value="mtoon">MToon 1.0 / 0.x</option>
          <option value="unlit">Unlit Texture</option>
        </select>
        <select id="atlasSel">
          <option value="torso">Torso UV (1024²)</option>
          <option value="head">Head UV (1024²)</option>
          <option value="body">Body UV (1024²)</option>
          <option value="hair">Hair UV (1024²)</option>
        </select>
      </div>
      <label class="small"><span data-i18n="authorLbl">作者名（VRM に書き込む名前）</span></label>
      <input id="authorInput" type="text" maxlength="64" placeholder="Unknown" style="width:100%;" />
      <div class="uv-box"><canvas id="uvCanvas" width="256" height="256"></canvas></div>
      <div class="grid3">
        <button id="btnExpV1" class="primary" disabled>.VRM 1.0</button>
        <button id="btnExpV0" disabled>.VRM 0.x</button>
        <button id="btnExpPng" disabled>UV .PNG</button>
      </div>
    </div>
  </aside>

  <main class="viewport">
    <canvas id="glCanvas"></canvas>
    <div class="hud">
      <div class="hud-pill" id="statsHud">Video → VRM Studio — Ready</div>
      <div class="hud-pill" id="camHud" data-i18n="camHint">ドラッグ: 回転 / ホイール: ズーム / 右ドラッグ: 平行移動</div>
    </div>
    <div class="cam-bar">
      <button class="cam-preset" data-cam="front" data-i18n="camFront">正面</button>
      <button class="cam-preset" data-cam="threeq" data-i18n="camThreeQ">斜め前</button>
      <button class="cam-preset" data-cam="rear" data-i18n="camRear">背面3/4</button>
      <button class="cam-preset" data-cam="neck" data-i18n="camNeck">首・襟確認</button>
      <button class="cam-preset" data-cam="hand" data-i18n="camHand">手・手首</button>
    </div>
  </main>
</div>

<video id="srcVideo" muted playsinline preload="auto" style="position:fixed;left:0;top:0;width:2px;height:2px;opacity:0.001;pointer-events:none;"></video>

    const inp = document.createElement("input"); inp.type = "range"; inp.min = "0"; inp.max = "1"; inp.step = "0.01"; inp.value = "0"; inp.dataset.expr = en;
    const val = document.createElement("span"); val.textContent = "0.00";
    inp.addEventListener("input", () => { state.exprWeights[en] = Number(inp.value); val.textContent = Number(inp.value).toFixed(2); updateHeadMorphsGL(); });
    row.append(lbl, inp, val);
    elExpr.appendChild(row);
  }
  $("langBtn")?.addEventListener("click", () => { curLang = curLang === "ja" ? "en" : "ja"; applyI18n(); });
  $("keyThRange")?.addEventListener("input", (e) => { const v = $("keyThVal"); if (v) v.textContent = e.target.value; });
  const selectVideo = (url, label) => { currentVideoUrl = url; currentName = label; const b = $("btnBuild"); if (b) b.disabled = false; setProg(0, `Selected: ${label} — click Generate!`); };
  $("btnSampleUniform")?.addEventListener("click", () => selectVideo("./sample_uniform.mp4", "uniform"));
  $("btnSampleIdol")?.addEventListener("click", () => selectVideo("./sample_idol.mp4", "idol"));

  const dz = $("dropZone"), fi = $("fileInput");
  dz?.addEventListener("click", () => fi?.click());
  dz?.addEventListener("dragover", (e) => { e.preventDefault(); dz.classList.add("drag"); });
  dz?.addEventListener("dragleave", () => dz.classList.remove("drag"));
  dz?.addEventListener("drop", (e) => { e.preventDefault(); dz.classList.remove("drag"); const f = e.dataTransfer?.files?.[0]; if (f) selectVideo(URL.createObjectURL(f), f.name.replace(/\.[^.]+$/, "")); });
  fi?.addEventListener("change", () => { const f = fi.files?.[0]; if (f) selectVideo(URL.createObjectURL(f), f.name.replace(/\.[^.]+$/, "")); });
  $("btnBuild")?.addEventListener("click", runPipeline);
  $("atlasSel")?.addEventListener("change", drawUvPreview);
  $("btnExpV1")?.addEventListener("click", () => { if (state.rigged) downloadBytes(buildVrmBytes(state.rigged, state.bonePos, state.thumbRgb, "1.0", $("shaderSel")?.value || "mtoon", currentName, currentAuthor()), `${currentName}_v1.vrm`); });
  $("btnExpV0")?.addEventListener("click", () => { if (state.rigged) downloadBytes(buildVrmBytes(state.rigged, state.bonePos, state.thumbRgb, "0.x", $("shaderSel")?.value || "mtoon", currentName, currentAuthor()), `${currentName}_v0.vrm`); });
  $("btnExpPng")?.addEventListener("click", () => { const pn = $("atlasSel")?.value; if (state.rigged?.[pn]) downloadBytes(encodeRgbToPngBytes(state.rigged[pn].tex, TEX_SZ, TEX_SZ), `${currentName}_${pn}_uv.png`, "image/png"); });

  document.querySelectorAll(".pose-btn").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll(".pose-btn").forEach((x) => x.classList.remove("active")); b.classList.add("active"); state.poseMode = b.dataset.pose;
    if (state.poseMode !== "vrma") { state.exprWeights.blink = 0; state.exprWeights.aa = 0; updateHeadMorphsGL(); }
  }));
  $("btnPlayPause")?.addEventListener("click", (e) => { state.playing = !state.playing; e.target.textContent = I18N[curLang][state.playing ? "pauseBtn" : "playBtn"]; });
  document.querySelectorAll("#meshChips .chip").forEach((ch) => ch.addEventListener("click", () => { ch.classList.toggle("on"); state.vis[ch.dataset.mesh] = ch.classList.contains("on"); }));

  const presets = {
    front:      { yaw: 0.0,   pitch: 0.05,  dist: 2.35, tx: 0,    ty: 0.80, tz: 0 },
    threeq:     { yaw: 0.56,  pitch: 0.14,  dist: 2.25, tx: 0,    ty: 0.80, tz: 0 },
    rear:       { yaw: 2.58,  pitch: 0.42,  dist: 1.35, tx: 0,    ty: 0.94, tz: 0 },
    neck:       { yaw: 0.56,  pitch: 0.24,  dist: 0.52, tx: 0,    ty: 1.31, tz: 0.01 },
    hand:       { yaw: 0.45,  pitch: 0.55,  dist: 0.34, tx: 0.50, ty: 1.18, tz: 0.02 },
  };
  document.querySelectorAll(".cam-preset").forEach((b) => b.addEventListener("click", () => Object.assign(state.cam, presets[b.dataset.cam] || presets.front)));
  const cvs = $("glCanvas"); let drag = 0, lx = 0, ly = 0;
  cvs?.addEventListener("mousedown", (e) => { drag = e.button === 2 ? 2 : 1; lx = e.clientX; ly = e.clientY; });
  cvs?.addEventListener("contextmenu", (e) => e.preventDefault());
  window.addEventListener("mouseup", () => { drag = 0; });
  window.addEventListener("mousemove", (e) => {
    if (!drag) return; const dx = e.clientX - lx, dy = e.clientY - ly; lx = e.clientX; ly = e.clientY;
    if (drag === 1) { state.cam.yaw -= dx * 0.008; state.cam.pitch = clip(state.cam.pitch + dy * 0.008, -1.2, 1.4); }
    else state.cam.ty = clip(state.cam.ty + dy * 0.002, 0.2, 1.6);
  });
  cvs?.addEventListener("wheel", (e) => { e.preventDefault(); state.cam.dist = clip(state.cam.dist * (1 + e.deltaY * 0.001), 0.22, 5.5); }, { passive: false });
}

if (typeof document !== "undefined") { if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", setupUI); else setupUI(); }
globalThis.Video2VRMStudio = {
  BONES, PARENT, BONE_IDX, EXPR_NAMES, TEX_SZ, WORLD_H,
  buildProceduralHead, buildProceduralLimbsAndHands, buildPolarLoftedTorso, buildVideoOccupancy,
  carveColorConsistentHair, bakeTextures, rigAvatar, buildVrmBytes, fitBodyParams, calibrateViews, chromaKeyAndDespill
};
})();
</script>
</body>
